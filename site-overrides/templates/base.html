<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='css/equ.css', cachebust=true) }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml') }}">
  <script defer src="{{ get_url(path='js/equ.js', cachebust=true) }}"></script>
</head>
<body>
  {% block backdrop %}{% endblock backdrop %}

  <div class="reading-progress" aria-hidden="true"></div>
  <header class="site-header">
    <div class="shell site-header-inner">
      <a class="brand" href="{{ config.base_url }}/">Equ</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="{{ config.base_url }}/">首页</a>
        <a href="{{ config.base_url }}/tags/">标签</a>
        <a href="{{ get_url(path='atom.xml') }}">RSS</a>
        <a href="https://github.com/Equuuu/Equ_Blog">GitHub</a>
      </nav>
      <div class="header-actions" aria-label="页面控制">
        <button class="icon-toggle music-toggle" type="button" aria-label="播放巴赫音乐" aria-pressed="false" title="播放巴赫音乐" data-music-src="https://upload.wikimedia.org/wikipedia/commons/transcoded/4/4b/Bach_-_Cello_Suite_no._1_in_G_major%2C_BWV_1007_-_IV._Sarabande.ogg/Bach_-_Cello_Suite_no._1_in_G_major%2C_BWV_1007_-_IV._Sarabande.ogg.mp3">
          <span class="control-icon music-toggle-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M9 18V5l10-2v13"></path>
              <circle cx="7" cy="18" r="3"></circle>
              <circle cx="17" cy="16" r="3"></circle>
            </svg>
          </span>
          <span class="sr-only music-toggle-label">播放巴赫音乐</span>
        </button>
        <button class="icon-toggle theme-toggle" type="button" aria-label="切换到夜间主题" aria-pressed="false" title="切换到夜间主题">
          <span class="control-icon theme-toggle-mark" aria-hidden="true">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" focusable="false">
              <path d="M21 14.4A8.2 8.2 0 0 1 9.6 3a7 7 0 1 0 11.4 11.4Z"></path>
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </span>
          <span class="sr-only theme-toggle-label">夜间</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <span>Equ's Blog</span>
    <span>Notes from GitHub Issues.</span>
  </footer>

  <button class="back-top" type="button" aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 24 24" focusable="false">
      <path d="m6 14 6-6 6 6"></path>
    </svg>
  </button>
</body>
</html>
